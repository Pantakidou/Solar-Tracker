  <script>
  (function(){
    const canvas = document.getElementById("globe");
    const context = canvas.getContext("2d");
    const width = Math.min(900, window.innerWidth - 40);
    const height = Math.min(700, window.innerHeight - 40);
    const radius = Math.min(width, height) / 2.5;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    context.scale(dpr, dpr);
    const projection = d3.geoOrthographic().scale(radius).translate([width/2, height/2]).clipAngle(90);
    const path = d3.geoPath().projection(projection).context(context);
    function pointInPolygon(point, polygon){
      const [x,y]=point; let inside=false;
      for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
        const [xi,yi]=polygon[i]; const [xj,yj]=polygon[j];
        if(yi>y!==yj>y && x<((xj-xi)*(y-yi))/(yj-yi)+xi) inside=!inside;
      }
      return inside;
    }
    function pointInFeature(point, feature){
      const g=feature.geometry;
      if(g.type==="Polygon"){
        const c=g.coordinates;
        if(!pointInPolygon(point,c[0])) return false;
        for(let i=1;i<c.length;i++) if(pointInPolygon(point,c[i])) return false;
        return true;
      } else if(g.type==="MultiPolygon"){
        for(const poly of g.coordinates){
          if(pointInPolygon(point,poly[0])){
            let inHole=false;
            for(let i=1;i<poly.length;i++){ if(pointInPolygon(point,poly[i])){ inHole=true; break; } }
            if(!inHole) return true;
          }
        }
        return false;
      }
      return false;
    }
    function generateDotsInPolygon(feature, dotSpacing){
      const dots=[]; const bounds=d3.geoBounds(feature);
      const [[minLng,minLat],[maxLng,maxLat]]=bounds;
      const stepSize=dotSpacing*0.08;
      for(let lng=minLng;lng<=maxLng;lng+=stepSize){
        for(let lat=minLat;lat<=maxLat;lat+=stepSize){
          const p=[lng,lat]; if(pointInFeature(p,feature)) dots.push(p);
        }
      }
      return dots;
    }
    const allDots=[]; let landFeatures=null;
    function drawCenterLabel(){
      const currentScale=projection.scale();
      const cx=width/2, cy=height/2;
      const fontSize = Math.max(10, Math.round(currentScale * 0.13));
      context.save();
      context.font = "700 " + fontSize + "px 'Cinzel', 'Trajan Pro', Georgia, serif";
      context.textAlign="center"; context.textBaseline="middle";
      if ("letterSpacing" in context) { context.letterSpacing = Math.max(1, fontSize*0.06) + "px"; }
      context.shadowColor = "#F0FF00";
      context.shadowBlur = fontSize * 1.4;
      context.fillStyle = "#F0FF00";
      context.fillText("RITUAL PRJCT", cx, cy);
      context.shadowBlur = fontSize * 0.7;
      context.fillText("RITUAL PRJCT", cx, cy);
      context.shadowBlur = 0;
      context.fillStyle = "#FFFFCC";
      context.fillText("RITUAL PRJCT", cx, cy);
      context.restore();
    }
    function render(){
      context.clearRect(0,0,width,height);
      const currentScale=projection.scale();
      const scaleFactor=currentScale/radius;
      context.beginPath();
      context.arc(width/2,height/2,currentScale,0,2*Math.PI);
      context.fillStyle="#000000"; context.fill();
      context.strokeStyle="#ffffff"; context.lineWidth=2*scaleFactor; context.stroke();
      drawCenterLabel();
      if(landFeatures){
        const graticule=d3.geoGraticule();
        context.beginPath(); path(graticule());
        context.strokeStyle="#ffffff"; context.lineWidth=1*scaleFactor;
        context.globalAlpha=0.25; context.stroke(); context.globalAlpha=1;
        context.beginPath();
        landFeatures.features.forEach(function(f){ path(f); });
        context.strokeStyle="#ffffff"; context.lineWidth=1*scaleFactor; context.stroke();
        allDots.forEach(function(dot){
          const p=projection([dot[0],dot[1]]);
          if(p && p[0]>=0 && p[0]<=width && p[1]>=0 && p[1]<=height){
            context.beginPath();
            context.arc(p[0],p[1],1.2*scaleFactor,0,2*Math.PI);
            context.fillStyle="#999999"; context.fill();
          }
        });
      }
    }
    const rotation=[0,0]; let autoRotate=true; const rotationSpeed=0.5;
    d3.timer(function(){ if(autoRotate){ rotation[0]+=rotationSpeed; projection.rotate(rotation); render(); } });
    canvas.addEventListener("mousedown", function(event){
      autoRotate=false;
      const startX=event.clientX, startY=event.clientY;
      const startRotation=rotation.slice();
      function onMove(e){
        const sensitivity=0.5;
        rotation[0]=startRotation[0]+(e.clientX-startX)*sensitivity;
        rotation[1]=startRotation[1]-(e.clientY-startY)*sensitivity;
        rotation[1]=Math.max(-90,Math.min(90,rotation[1]));
        projection.rotate(rotation); render();
      }
      function onUp(){
        document.removeEventListener("mousemove",onMove);
        document.removeEventListener("mouseup",onUp);
        setTimeout(function(){ autoRotate=true; },10);
      }
      document.addEventListener("mousemove",onMove);
      document.addEventListener("mouseup",onUp);
    });
    canvas.addEventListener("wheel", function(event){
      event.preventDefault();
      const factor=event.deltaY>0?0.9:1.1;
      const newRadius=Math.max(radius*0.5,Math.min(radius*3,projection.scale()*factor));
      projection.scale(newRadius); render();
    }, {passive:false});
    render();
    landFeatures = window.__LAND_DATA__;
    landFeatures.features.forEach(function(feature){
      const dots=generateDotsInPolygon(feature,16);
      dots.forEach(function(d){ allDots.push(d); });
    });
    render();
    if (document.fonts && document.fonts.load) {
      document.fonts.load("700 40px 'Cinzel'").then(function(){ render(); });
    }
  })();
