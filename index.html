<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritual Prjct — Rotating Globe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      border-radius: 16px;
      background: #0a0a0a;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
    }
    .hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 12px;
      color: #a3a3a3;
      background: rgba(23, 23, 23, 0.85);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .loading {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 12px;
      color: #a3a3a3;
      background: rgba(23, 23, 23, 0.85);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .loading.hidden { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="globe"></canvas>
  </div>
  <div class="hint">Drag to rotate • Scroll to zoom</div>
  <div class="loading" id="loading">Loading land data…</div>

  <script src="vendor/d3.min.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("globe");
      const context = canvas.getContext("2d");
      const loadingEl = document.getElementById("loading");

      const width = Math.min(900, window.innerWidth - 40);
      const height = Math.min(700, window.innerHeight - 40);
      const radius = Math.min(width, height) / 2.5;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      context.scale(dpr, dpr);

      const projection = d3.geoOrthographic()
        .scale(radius)
        .translate([width / 2, height / 2])
        .clipAngle(90);

      const path = d3.geoPath().projection(projection).context(context);

      function pointInPolygon(point, polygon) {
        const [x, y] = point;
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const [xi, yi] = polygon[i];
          const [xj, yj] = polygon[j];
          if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      function pointInFeature(point, feature) {
        const g = feature.geometry;
        if (g.type === "Polygon") {
          const c = g.coordinates;
          if (!pointInPolygon(point, c[0])) return false;
          for (let i = 1; i < c.length; i++) if (pointInPolygon(point, c[i])) return false;
          return true;
        } else if (g.type === "MultiPolygon") {
          for (const poly of g.coordinates) {
            if (pointInPolygon(point, poly[0])) {
              let inHole = false;
              for (let i = 1; i < poly.length; i++) {
                if (pointInPolygon(point, poly[i])) { inHole = true; break; }
              }
              if (!inHole) return true;
            }
          }
          return false;
        }
        return false;
      }

      function generateDotsInPolygon(feature, dotSpacing) {
        const dots = [];
        const bounds = d3.geoBounds(feature);
        const [[minLng, minLat], [maxLng, maxLat]] = bounds;
        const stepSize = dotSpacing * 0.08;
        for (let lng = minLng; lng <= maxLng; lng += stepSize) {
          for (let lat = minLat; lat <= maxLat; lat += stepSize) {
            const p = [lng, lat];
            if (pointInFeature(p, feature)) dots.push(p);
          }
        }
        return dots;
      }

      const allDots = [];
      let landFeatures = null;

      function drawCenterLabel() {
        const currentScale = projection.scale();
        const scaleFactor = currentScale / radius;
        const cx = width / 2;
        const cy = height / 2;
        context.save();
        context.font = "bold " + Math.round(34 * scaleFactor) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillStyle = "#FFD400";
        context.shadowColor = "rgba(0, 0, 0, 0.9)";
        context.shadowBlur = 8 * scaleFactor;
        context.fillText("Ritual Prjct", cx, cy);
        context.restore();
      }

      function render() {
        context.clearRect(0, 0, width, height);
        const currentScale = projection.scale();
        const scaleFactor = currentScale / radius;

        // Ocean / globe disk
        context.beginPath();
        context.arc(width / 2, height / 2, currentScale, 0, 2 * Math.PI);
        context.fillStyle = "#000000";
        context.fill();
        context.strokeStyle = "#ffffff";
        context.lineWidth = 2 * scaleFactor;
        context.stroke();

        if (landFeatures) {
          const graticule = d3.geoGraticule();
          context.beginPath();
          path(graticule());
          context.strokeStyle = "#ffffff";
          context.lineWidth = 1 * scaleFactor;
          context.globalAlpha = 0.25;
          context.stroke();
          context.globalAlpha = 1;

          context.beginPath();
          landFeatures.features.forEach(function (f) { path(f); });
          context.strokeStyle = "#ffffff";
          context.lineWidth = 1 * scaleFactor;
          context.stroke();

          allDots.forEach(function (dot) {
            const projected = projection([dot[0], dot[1]]);
            if (projected && projected[0] >= 0 && projected[0] <= width && projected[1] >= 0 && projected[1] <= height) {
              context.beginPath();
              context.arc(projected[0], projected[1], 1.2 * scaleFactor, 0, 2 * Math.PI);
              context.fillStyle = "#999999";
              context.fill();
            }
          });
        }

        // Fixed yellow label inside the globe (does not rotate)
        drawCenterLabel();
      }

      const rotation = [0, 0];
      let autoRotate = true;
      const rotationSpeed = 0.5;

      const timer = d3.timer(function () {
        if (autoRotate) {
          rotation[0] += rotationSpeed;
          projection.rotate(rotation);
          render();
        }
      });

      canvas.addEventListener("mousedown", function (event) {
        autoRotate = false;
        const startX = event.clientX;
        const startY = event.clientY;
        const startRotation = rotation.slice();
        function onMove(e) {
          const sensitivity = 0.5;
          rotation[0] = startRotation[0] + (e.clientX - startX) * sensitivity;
          rotation[1] = startRotation[1] - (e.clientY - startY) * sensitivity;
          rotation[1] = Math.max(-90, Math.min(90, rotation[1]));
          projection.rotate(rotation);
          render();
        }
        function onUp() {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          setTimeout(function () { autoRotate = true; }, 10);
        }
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });

      canvas.addEventListener("wheel", function (event) {
        event.preventDefault();
        const factor = event.deltaY > 0 ? 0.9 : 1.1;
        const newRadius = Math.max(radius * 0.5, Math.min(radius * 3, projection.scale() * factor));
        projection.scale(newRadius);
        render();
      }, { passive: false });

      // Initial render so the user sees something immediately
      render();

      fetch("vendor/ne_110m_land.json")
        .then(function (r) {
          if (!r.ok) throw new Error("Failed to load land data");
          return r.json();
        })
        .then(function (data) {
          landFeatures = data;
          landFeatures.features.forEach(function (feature) {
            const dots = generateDotsInPolygon(feature, 16);
            dots.forEach(function (d) { allDots.push(d); });
          });
          loadingEl.classList.add("hidden");
          render();
        })
        .catch(function () {
          loadingEl.textContent = "Failed to load land data";
        });
    })();
  </script>
</body>
</html>
